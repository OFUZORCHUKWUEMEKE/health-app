components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    reminderKey:
      type: apiKey
      in: header
      name: x-reminder-key
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueryQ:
      name: q
      in: query
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    PerPage:
      name: perPage
      in: query
      schema: { type: integer, default: 20, maximum: 100 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 20 }
    StatusQuery:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/AppointmentStatus' }
    FromQuery:
      name: from
      in: query
      schema: { type: string, format: date-time }
    ToQuery:
      name: to
      in: query
      schema: { type: string, format: date-time }
    DateTimeLocal:
      name: datetime_local
      in: query
      required: true
      schema: { type: string, example: '2026-09-12T09:00' }
    Timezone:
      name: timezone
      in: query
      required: true
      schema: { type: string, example: UTC }
    Duration:
      name: duration
      in: query
      required: true
      schema: { type: integer, enum: [15, 30, 45, 60] }
  responses:
    BadRequest:
      description: Validation failure (006)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: Missing/invalid token (011)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Wrong role or foreign record (009)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Missing record (004)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: State conflict (409)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many requests (429)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PayloadTooLarge:
      description: File exceeds size cap (413)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    UnsupportedMedia:
      description: Non-image content type (415)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: Provider/upstream failure (016/500)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceUnavailable:
      description: Unconfigured provider or database (503)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Envelope:
      type: object
      required:
        [
          success,
          response_code,
          response_description,
          data,
          request_id,
          path,
          timestamp,
        ]
      properties:
        success: { type: boolean, example: true }
        response_code: { type: string, example: '00' }
        response_description: { type: string, example: Success }
