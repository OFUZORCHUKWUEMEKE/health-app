openapi: 3.0.3
info:
  title: Telemex Go API
  version: 1.0.0
  description: >
    Telemedicine backend (Go + PostgreSQL). Every response —
    success or error — uses the standard envelope
    `{success, response_code, response_description, data, message,
    request_id, path, timestamp}`. `response_code` is a numeric string:
    `00` success, `006` validation, `009` forbidden,
    `011` unauthenticated, `004` not found, `016` server error.
    See `quirks.md` for preserved frontend-compat behaviors.
servers:
  - url: http://localhost:4000/api/v1
tags:
  - name: System
    description: Health, version, readiness, spec
  - name: Auth
    description: Registration, login, tokens, password flows, Google OAuth
  - name: Patients
    description: Patient self-service profile
  - name: Doctors
    description: Doctor self-service profile + patient lookup
  - name: Admin
    description: Admin user management + metrics
  - name: Booking
    description: Availability, slots, appointments
  - name: ConsultationsPatient
    description: Patient consultation reads
  - name: ConsultationsDoctor
    description: Doctor consultation workspace + clinical writes
  - name: Notifications
    description: Feeds + reminder dispatch
  - name: Video
    description: Daily.co video rooms + tokens
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status: { type: string, example: ok }
  /version:
    get:
      tags: [System]
      summary: Build metadata
      security: []
      responses:
        '200':
          description: Version info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/VersionInfo' }
  /readyz:
    get:
      tags: [System]
      summary: Readiness (database + pool stats)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Database unconfigured or unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /openapi.yaml:
    get:
      tags: [System]
      summary: This OpenAPI document
      security: []
      responses:
        '200':
          description: YAML spec
          content:
            text/yaml:
              schema: { type: string }
  # ------------------------------------------------------------- Auth ----
  /auth/patients/register/initiate:
    post:
      tags: [Auth]
      summary: Start patient registration (OTP)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OtpInitiated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/patients/register/verify-otp:
    post:
      tags: [Auth]
      summary: Verify registration OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp: { type: string }
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RegistrationToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/patients/register/resend-otp:
    post:
      tags: [Auth]
      summary: Resend registration OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: OTP resent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OtpInitiated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/patients/register/complete:
    post:
      tags: [Auth]
      summary: Complete patient registration
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_token, first_name, last_name, password]
              properties:
                registration_token: { type: string }
                first_name: { type: string }
                last_name: { type: string }
                middle_name: { type: string }
                phone_number: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PatientSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/patients/signup:
    post:
      tags: [Auth]
      summary: Single-step patient signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, password]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                middle_name: { type: string }
                email: { type: string, format: email }
                phone_number: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Patient created (unverified)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PatientSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/patients/login:
    post:
      tags: [Auth]
      summary: Patient login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PatientSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/doctors/login:
    post:
      tags: [Auth]
      summary: Doctor login (inactive doctors rejected)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DoctorSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/doctors/signup:
    post:
      tags: [Auth]
      summary: Create doctor (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, first_name, last_name, password]
              properties:
                email: { type: string, format: email }
                first_name: { type: string }
                last_name: { type: string }
                password: { type: string, minLength: 8 }
                phone_number: { type: string }
      responses:
        '201':
          description: Doctor created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DoctorSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/admins/login:
    post:
      tags: [Auth]
      summary: Admin login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/admins/bootstrap:
    post:
      tags: [Auth]
      summary: Bootstrap first admin (key-gated)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [first_name, last_name, email, password, bootstrap_key]
              properties:
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string, format: email }
                phone_number: { type: string }
                password: { type: string, minLength: 8 }
                role: { type: string, default: super_admin }
                bootstrap_key: { type: string }
      responses:
        '201':
          description: Admin created or updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/AdminSession'
                          - type: object
                            properties:
                              mode: { type: string, enum: [created, updated] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token
      security: []
      description: >
        Note the camelCase keys — unlike login which answers
        `token`/`refresh_token`, refresh answers
        `accessToken`/`refreshToken`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken, role]
              properties:
                refreshToken: { type: string }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Tokens rotated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [accessToken, refreshToken]
                        properties:
                          accessToken: { type: string }
                          refreshToken: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change own password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmNewPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
                confirmNewPassword: { type: string }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [message]
                        properties:
                          message:
                            {
                              type: string,
                              example: 'Password changed successfully',
                            }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout (revoke refresh token)
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [message]
                        properties:
                          message:
                            { type: string, example: 'Logged out successfully' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/forgot-password/initiate:
    post:
      tags: [Auth]
      summary: Start password reset (anti-enumeration)
      security: []
      description: Unknown emails get a generic message with no OTP fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Reset initiated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OtpInitiated' }
  /auth/forgot-password/verify-otp:
    post:
      tags: [Auth]
      summary: Verify reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp: { type: string }
      responses:
        '200':
          description: OTP verified
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message: { type: string }
                          reset_token: { type: string }
                          reset_redirect_url: { type: string }
                          expires_in: { type: string, example: 15m }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/forgot-password/reset:
    post:
      tags: [Auth]
      summary: Reset password with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, password, confirm_password]
              properties:
                reset_token: { type: string }
                password: { type: string, minLength: 8 }
                confirm_password: { type: string }
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [message]
                        properties:
                          message:
                            {
                              type: string,
                              example: 'Password reset successfully',
                            }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/google:
    get:
      tags: [Auth]
      summary: Start Google OAuth (redirect)
      security: []
      responses:
        '302': { description: Redirect to Google }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback (redirects to frontend)
      security: []
      parameters:
        - in: query
          name: code
          schema: { type: string }
      responses:
        '302': { description: Redirect to frontend with tokens }
  # -------------------------------------------------------- Patients ----
  /patients/me:
    get:
      tags: [Patients]
      summary: Patient summary
      security: [bearerAuth: []]
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PatientSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Patients]
      summary: Update patient profile (JSON or multipart)
      security: [bearerAuth: []]
      description: Allowlist keys only; unknown keys 400. Scalars blank leave untouched; arrays replace.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientPatch' }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                first_name: { type: string }
                last_name: { type: string }
                allergies:
                  { type: string, description: 'JSON array string; "" clears' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PatientProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /patients/me/profile:
    get:
      tags: [Patients]
      summary: Full patient profile
      security: [bearerAuth: []]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PatientProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Patients]
      summary: Update patient profile (alias)
      security: [bearerAuth: []]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientPatch' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PatientProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /patients/me/metrics:
    get:
      tags: [Patients]
      summary: Patient counts (consultations, medications, investigations, appointments)
      security: [bearerAuth: []]
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PatientMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /patients/me/timezone:
    patch:
      tags: [Patients]
      summary: Set patient timezone
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone: { type: string, example: Africa/Lagos }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PatientProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /patients/me/profile-picture:
    patch:
      tags: [Patients]
      summary: Set profile picture URL
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile_picture_url]
              properties:
                profile_picture_url: { type: string }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PatientProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /patients/me/profile-picture/upload:
    post:
      tags: [Patients]
      summary: Upload profile picture (5MB max)
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                image: { type: string, format: binary }
                profile_picture: { type: string, format: binary }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PatientProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMedia' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  # --------------------------------------------------------- Doctors ----
  /doctors/me:
    get:
      tags: [Doctors]
      summary: Doctor summary
      security: [bearerAuth: []]
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DoctorSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Doctors]
      summary: Update doctor profile
      security: [bearerAuth: []]
      description: 6 keys only (first_name, last_name, phone_number, profile_picture_url, license_no, specializations).
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoctorPatch' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DoctorProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /doctors/me/profile:
    get:
      tags: [Doctors]
      summary: Full doctor profile
      security: [bearerAuth: []]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DoctorProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Doctors]
      summary: Update doctor profile (alias)
      security: [bearerAuth: []]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoctorPatch' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DoctorProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /doctors/me/metrics:
    get:
      tags: [Doctors]
      summary: Doctor counts (open consults, unsent meds/lists, upcoming appointments)
      security: [bearerAuth: []]
      responses:
        '200':
          description: Metrics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DoctorMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /doctors/me/timezone:
    patch:
      tags: [Doctors]
      summary: Set doctor timezone
      security: [bearerAuth: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                timezone: { type: string, example: Africa/Lagos }
      responses:
        '200':
          description: Updated profile
          content:
