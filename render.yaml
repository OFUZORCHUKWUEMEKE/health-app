services:
  - type: web
    name: health-app-backend
    env: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build:render
    startCommand: pnpm run start:prod
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRATION
        value: 7d
      - key: JWT_REFRESH_EXPIRATION
        value: 90d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 2525
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: Health App
      - key: ALLOW_ADMIN_BOOTSTRAP
        value: false
      - key: ADMIN_BOOTSTRAP_KEY
        sync: false
      # Shared secret for POST /api/v1/internal/reminders/dispatch. Optional: reminders run
      # on an in-process cron regardless. Leave unset to disable the manual trigger — an
      # unset key means disabled, never open.
      - key: REMINDER_DISPATCH_KEY
        sync: false
